<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q9 Form Validation</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Form Submit Blocker with Live Errors</h1><form id="signupForm" novalidate><label for="fullName">Name</label><input id="fullName" autocomplete="name"><p class="error" id="fullNameError"></p><label for="emailAddress">Email</label><input id="emailAddress" type="email" autocomplete="email"><p class="error" id="emailAddressError"></p><label for="userPassword">Password</label><input id="userPassword" type="password" autocomplete="new-password"><p class="error" id="userPasswordError"></p><button type="submit">Submit</button></form><p class="success" id="successMessage" aria-live="polite"></p></main><script src="q9.js"></script></body></html>
