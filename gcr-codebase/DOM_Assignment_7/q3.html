<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q3 Multi-Step Form</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Multi-Step Form</h1><form id="wizardForm"><section class="step" data-step="0"><label for="name">Name</label><input id="name" autocomplete="name" required><p class="error" id="nameError"></p></section><section class="step" data-step="1" hidden><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><p class="error" id="emailError"></p></section><section class="step" data-step="2" hidden><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><p class="error" id="passwordError"></p></section><div><button type="button" id="back" class="secondary" hidden>Back</button><button type="button" id="next">Next</button><button type="submit" id="finish" hidden>Finish</button></div></form><div id="summary" aria-live="polite"></div></main><script src="q3.js"></script></body></html>
