<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Object Updater</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 9px; }
    button { margin-top: 16px; padding: 10px 16px; }
    pre { background: #f2f2f2; padding: 12px; }
  </style>
</head>
<body>
  <h1>Update User Details</h1>
  <form id="userForm">
    <label for="name">Name</label><input id="name" value="John" required>
    <label for="email">Email</label><input id="email" type="email" value="john@mail.com" required>
    <label for="age">Age</label><input id="age" type="number" min="1" max="120" value="21" required>
    <button type="submit">Update User</button>
  </form>
  <h2>Updated Object</h2>
  <pre id="output"></pre>
  <script>
    const user = { name: "John", email: "john@mail.com", age: 21 };
    const form = document.getElementById("userForm");
    const output = document.getElementById("output");

    function displayUser() {
      output.textContent = JSON.stringify(user, null, 2);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      user.name = document.getElementById("name").value.trim();
      user.email = document.getElementById("email").value.trim();
      user.age = Number(document.getElementById("age").value);
      displayUser();
    });

    displayUser();
  </script>
</body>
</html>
