<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Showcase</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Image Showcase Layout</h1></header><main class="gallery">
  <figure><div class="image-wrap"><img src="https://picsum.photos/500/350?random=1" alt="Nature scene"></div><figcaption>Nature</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://picsum.photos/500/350?random=2" alt="Architecture"></div><figcaption>Architecture</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://picsum.photos/500/350?random=3" alt="Mountains"></div><figcaption>Mountains</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://picsum.photos/500/350?random=4" alt="City"></div><figcaption>City Life</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://picsum.photos/500/350?random=5" alt="Ocean"></div><figcaption>Ocean</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://picsum.photos/500/350?random=6" alt="Forest"></div><figcaption>Forest</figcaption></figure>
</main><footer><p>Responsive image gallery using CSS Grid.</p></footer></body></html>
