<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Tooltips</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Tooltip Demonstration</h1></header><main class="tooltip-area">
  <div class="tip-item">HTML<span class="tooltip">Structure of a webpage</span></div>
  <div class="tip-item">CSS<span class="tooltip">Styles the webpage</span></div>
  <div class="tip-item">Grid<span class="tooltip">Two-dimensional layout system</span></div>
  <div class="tip-item">Flexbox<span class="tooltip">One-dimensional layout system</span></div>
</main><footer><p>Hover over each word to see its tooltip.</p></footer></body></html>
