<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini User Interface</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Study Planner</h1></header><main class="layout"><section class="card"><img src="https://picsum.photos/180/120?random=20" alt="Study desk"><div class="details"><h2>Plan Your Learning</h2><p>Organize your next CSS practice session.</p><form><label for="topic">Topic</label><input id="topic" type="text" placeholder="Enter topic"><label for="email">Email</label><input id="email" type="email" placeholder="Enter email"><div class="form-actions"><button type="submit">Save Plan</button><button type="reset" class="reset">Reset</button></div></form></div></section></main><footer><p>Responsive mini user interface using Flexbox.</p></footer></body></html>
